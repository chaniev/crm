name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    outputs:
      task_id: ${{ steps.selection.outputs.task_id }}
      evidence_artifact: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select checks from the event diff and task contract
        id: selection
        run: python3 scripts/harness/ci_verification.py prepare

      - uses: actions/setup-dotnet@v5
        if: steps.selection.outputs.backend == 'true'
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        if: steps.selection.outputs.frontend == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        if: steps.selection.outputs.bot == 'true'
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.selection.outputs.bot == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: bot/uv.lock

      - name: Run selected baseline and task checks once
        run: python3 scripts/harness/ci_verification.py run

      - name: Upload verification evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-${{ github.run_attempt }}
          path: .artifacts/verification/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload selection diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: selection-${{ github.run_attempt }}
          path: .artifacts/ci/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ github.run_attempt }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  verification-gate:
    if: always()
    runs-on: ubuntu-latest
    needs: [verification]
    steps:
      - uses: actions/checkout@v7

      - name: Download verification evidence
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.verification.outputs.evidence_artifact }}
          path: .artifacts/verification-input
          merge-multiple: true

      - name: Aggregate merge-gate evidence
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          REQUIRED_TASK_ID: ${{ needs.verification.outputs.task_id }}
        shell: bash
        run: |
          arguments=()
          if [[ -n "$REQUIRED_TASK_ID" ]]; then
            arguments+=(--require-task-id "$REQUIRED_TASK_ID")
          fi
          python3 scripts/harness/aggregate_evidence.py \
            --input-dir .artifacts/verification-input \
            --report .artifacts/verification-gate.json \
            --require-report verification.json \
            "${arguments[@]}"
          test "$VERIFICATION_RESULT" = success

      - name: Upload aggregate merge-gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-gate-${{ github.run_attempt }}
          path: .artifacts/verification-gate.json
          if-no-files-found: error
          retention-days: 14
