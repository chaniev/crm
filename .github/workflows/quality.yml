name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate requirements registry and active backlog
        run: >-
          python3 scripts/harness/verify_change.py
          --profile full
          --area requirements

      - name: Require changelog for requirement changes
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/harness/verify_change.py
          --profile full
          --area requirements
          --base "${{ github.event.pull_request.base.sha }}"

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test verification harness
        run: >-
          python3 scripts/harness/verify_change.py
          --profile full
          --area harness

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run backend quality baseline
        run: >-
          python3 scripts/harness/verify_change.py
          --profile full
          --area backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run frontend quality baseline
        run: >-
          python3 scripts/harness/verify_change.py
          --profile full
          --area frontend

  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: bot/uv.lock

      - name: Run bot quality baseline
        run: >-
          python3 scripts/harness/verify_change.py
          --profile full
          --area bot

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run deploy quality baseline
        run: >-
          python3 scripts/harness/verify_change.py
          --profile full
          --area deploy
