  <g transform="translate(36 545)"><circle class="badge" cx="17" cy="17" r="17"/><text class="num" x="17" y="17">1</text><text class="title" x="54" y="11">Выбранная дата не читается</text><text class="copy" x="54" y="43"><tspan x="54">Поле даты сжимается до пустого квадрата — ключевой контекст</tspan><tspan x="54" dy="24">решения скрыт.</tspan></text></g>
  <g transform="translate(36 690)"><circle class="badge" cx="17" cy="17" r="17"/><text class="num" x="17" y="17">2</text><text class="title" x="54" y="11">Roster не попадает в видимую область</text><text class="copy" x="54" y="43"><tspan x="54">Первый клиент и действие отметки остаются ниже экрана,</tspan><tspan x="54" dy="24">хотя высота уже критически мала.</tspan></text></g>
