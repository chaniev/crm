<script>
  (() => {
    const root = document.getElementById('crm-schedule-redesign');
    const toast = root.querySelector('.crm-toast');
    let toastTimer;
    const showToast = (message) => {
      toast.textContent = message;
      toast.classList.add('crm-toast-visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('crm-toast-visible'), 1400);
    };

    root.querySelectorAll('.crm-attendance').forEach((button) => {
      button.addEventListener('click', () => showToast('Открываем посещаемость'));
    });
    root.querySelector('.crm-create').addEventListener('click', () => showToast('Создать разовое занятие'));

    const filterButton = root.querySelector('.crm-filter-button');
    const filterState = root.querySelector('.crm-filter-state');
    const setFiltersOpen = (open) => {
      filterButton.setAttribute('aria-expanded', String(open));
      filterState.hidden = !open;
    };
    filterButton.addEventListener('click', () => setFiltersOpen(filterState.hidden));
    filterState.querySelector('button').addEventListener('click', () => setFiltersOpen(false));

    const dates = [
      ['28.08.2026', 'пятница', '12 занятий'],
      ['29.08.2026', 'суббота', '14 занятий'],
      ['30.08.2026', 'воскресенье', '9 занятий']
    ];
    let dateIndex = 1;
    root.querySelectorAll('[data-day-step]').forEach((button) => {
      button.addEventListener('click', () => {
        dateIndex = Math.max(0, Math.min(dates.length - 1, dateIndex + Number(button.dataset.dayStep)));
        root.querySelector('[data-date]').textContent = dates[dateIndex][0];
        root.querySelector('[data-weekday]').textContent = dates[dateIndex][1];
        root.querySelector('[data-count]').textContent = dates[dateIndex][2];
      });
    });
  })();
</script>
